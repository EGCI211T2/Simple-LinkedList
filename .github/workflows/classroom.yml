name: Autograding Tests
'on':
- workflow_dispatch
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test Destructor
      id: test-destructor
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test Destructor
        setup-command: g++ main.cpp -o ll
        command: "./ll"
        input: ''
        expected-output: |-
          Deleting 5
          Deleting 8
          Deleting 11
        comparison-method: contains
        timeout: 10
        max-score: 10
    - name: Linked list1
      id: linked-list1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Linked list1
        setup-command: g++ mian_ll.cpp -o ll
        command: "./ll 2 3 1 6 7"
        input: 2->3->1->6->7->NULL
        expected-output: ''
        comparison-method: contains
        timeout: 10
        max-score: 15
    - name: simple
      id: simple
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: simple
        setup-command: g++ main.cpp -o .ll
        command: "./ll"
        input: ''
        expected-output: 3->5->8->NULL
        comparison-method: contains
        timeout: 10
        max-score: 10
    - name: Linked list2
      id: linked-list2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Linked list2
        setup-command: g++ mian_ll.cpp -o ll
        command: "./ll 2 3 6 7"
        input: ''
        expected-output: |-
          Deleting 2
          Deleting 3
          Deleting 6
          Deleting 7
        comparison-method: contains
        timeout: 10
        max-score: 15
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST-DESTRUCTOR_RESULTS: "${{steps.test-destructor.outputs.result}}"
        LINKED-LIST1_RESULTS: "${{steps.linked-list1.outputs.result}}"
        SIMPLE_RESULTS: "${{steps.simple.outputs.result}}"
        LINKED-LIST2_RESULTS: "${{steps.linked-list2.outputs.result}}"
      with:
        runners: test-destructor,linked-list1,simple,linked-list2
